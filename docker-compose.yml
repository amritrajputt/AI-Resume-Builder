services:
  postgres:
    image: postgres:14.2
    container_name: resume-builder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: resume_builder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: resume-builder-redis
    restart: unless-stopped
    ports:
      - "6369:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: